[apt]
pre=apt-get update
# shell=bash -lc
# command=apt-get install -y
install=apt-get install -y
post=apt-get clean && rm -rf /var/lib/apt/lists/* /var/tmp/*
mode=multi
packages:
  # Core build and system utilities
  apt-utils
  build-essential
  curl
  file
  git
  ruby-full
  locales
  sudo
  wget
  unzip
  dbus
  socat          # prereq
  imagemagick    # prereq
  libsixel-bin   # prereq

  # Shell and bash extras
  bash-completion
  bash-doc

  # Monitoring and process tools
  htop           # classic monitor
  btop           # modern resource monitor (replacement/upgrade)

  # Tree and filesystem utilities
  tree
  eza            # modern ls replacement (instead of lsd)
  bat            # modern cat with syntax highlighting
  fd-find        # fast find alternative
  ripgrep        # fast grep
  zoxide         # smarter cd / directory jumping

  # Git and diff helpers
  git-delta      # better git diff pager

  # Search and navigation
  fzf            # fuzzy finder
  tldr           # simplified man pages (Debian package name: tealdeer)

  # JSON and data tools
  jq
